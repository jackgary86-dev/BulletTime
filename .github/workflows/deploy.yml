name: Test, build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          # The web build doesn't need the Electron binary (#38); release.yml downloads it.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
      # Typechecks, then builds with the /BulletTime/ base path (see vite.config.ts).
      - run: npm run build
      # The itch.io upload: a relative-path build zipped with index.html at the root (#110).
      - run: npm run build:itch
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: bullettime-web-itch
          path: release/bullettime-web-*.zip
          if-no-files-found: error
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/configure-pages@v6
        with:
          # Turns Pages on (source: GitHub Actions) the first time, where the token is allowed to.
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
