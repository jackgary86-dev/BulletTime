name: Desktop installers

# Pushing a version tag (v0.2.0, ...) builds the desktop app (#38) on all three
# platforms and attaches the installers and the itch.io zip to a GitHub release.
on:
  push:
    tags: ['v*']
  # Pull requests that touch the desktop app check that all three installers still build.
  pull_request:
    paths: ['electron/**', 'scripts/build-steam.mjs', 'scripts/smoke-desktop.mjs', 'steam/**', 'build/**', 'package.json', 'package-lock.json', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Unsigned builds; see README "Desktop app" for code signing.
      - run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Smoke test (#206): open the built app, pass the content warning, check the launcher
      # offers all four simulators, then load each one and fire a shot. dist-desktop/ is
      # already built by the step above. Linux has no display, so it runs under xvfb.
      - if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a npm run smoke -- --skip-build
      - if: matrix.os != 'ubuntu-latest'
        run: npm run smoke -- --skip-build
      # Steam depot content for this OS (#111): release/steam/<os>/.
      - run: npm run dist:steam
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: steam-${{ runner.os }}
          path: release/steam/
          if-no-files-found: error
      - if: matrix.os == 'ubuntu-latest'
        run: npm run build:itch
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/bullettime-web-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: installers-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: true
