<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BulletTime: a slow-motion 3D bullet impact simulator" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Bundled fonts, linked here so the loading screen already has them (#106). -->
    <link rel="stylesheet" href="/src/fonts.css" />
    <title>BulletTime</title>
    <!-- The loading screen's own styles, inline so it paints before any script runs (#77). -->
    <style>
      #loader {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(ellipse at 50% 45%, #1a1d22 0%, #07080a 70%);
        color: #e6e9ee;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.7s ease;
      }
      #loader.done {
        opacity: 0;
        pointer-events: none;
      }
      #loader .loader-mark {
        width: 72px;
        height: 72px;
        margin-bottom: -14px;
      }
      #loader .loader-title {
        margin: 0;
        font-family: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
        font-size: 44px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #e0a24a;
      }
      #loader .loader-tagline {
        margin: -14px 0 6px;
        font-size: 13px;
        color: #8a93a1;
      }
      #loader .loader-bar {
        width: min(280px, 70vw);
        height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      #loader .loader-bar span {
        display: block;
        height: 100%;
        width: 4%;
        background: linear-gradient(90deg, #c9862f, #f5be6a);
        box-shadow: 0 0 10px rgba(224, 162, 74, 0.6);
        transition: width 0.35s ease;
      }
      #loader .loader-status {
        margin: 0;
        min-height: 1.4em;
        font-size: 12px;
        letter-spacing: 0.06em;
        color: #8a93a1;
      }
      #loader.failed .loader-status {
        max-width: min(420px, 80vw);
        text-align: center;
        color: #ff8a7a;
      }
      @media (prefers-reduced-motion: reduce) {
        #loader,
        #loader .loader-bar span {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="viewport"></canvas>
      <div id="overlay"></div>
    </div>
    <div id="loader" role="status" aria-live="polite">
      <svg class="loader-mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M1 13.5h5M2.5 16h4M1 18.5h5" stroke="#8a93a1" stroke-width="1" stroke-linecap="round" opacity="0.6" />
        <rect x="8" y="12" width="10" height="8" rx="0.8" fill="#a8742c" />
        <rect x="8" y="12" width="10" height="2" rx="0.8" fill="#d8a04e" opacity="0.6" />
        <path d="M18 12h3c4.5 0 8 2.6 9.5 4-1.5 1.4-5 4-9.5 4h-3z" fill="#c8793a" />
        <path d="M18 12h3c4.5 0 8 2.6 9.5 4H18z" fill="#e6a061" opacity="0.55" />
      </svg>
      <h1 class="loader-title">BulletTime</h1>
      <p class="loader-tagline">Slow-motion bullet impact simulator</p>
      <div class="loader-bar"><span></span></div>
      <p class="loader-status">Loading</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
